services:
  clase04:
    build:
      context: ../backend
    image: estudia-clase04:1
    env_file:
      - secrets.env
    networks:
      - airflow
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v4/health', timeout=5)
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  airflow:
    external: true
    name: airflow_default
